<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Lab Booking</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .navbar { background-color: #1a1a2e; }
    .navbar-brand, .nav-link { color: #fff !important; }
    .nav-link:hover { color: #90caf9 !important; }
    .card { border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .badge-available { background-color: #198754; }
    .badge-maintenance { background-color: #dc3545; }
    .badge-booked { background-color: #fd7e14; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">🧪 Smart Lab Booking</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" href="/">Equipment</a>
        <a class="nav-link" href="/my-bookings">My Bookings</a>
        <a class="nav-link" href="/dashboard">Maintenance</a>
      </div>
    </div>
  </nav>

  <div class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
